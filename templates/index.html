<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Biomarker Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .record-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #667eea;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .record-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .record-btn.recording {
            background: #ef4444;
            border-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .mic-icon {
            font-size: 48px;
        }

        .status {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .timer {
            font-size: 24px;
            color: #333;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 30px 0;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .results {
            display: none;
        }

        .result-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .result-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .pill {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .pill.low {
            background: #d1fae5;
            color: #065f46;
        }

        .pill.moderate {
            background: #fed7aa;
            color: #92400e;
        }

        .pill.high {
            background: #fecaca;
            color: #991b1b;
        }

        .pill.neutral {
            background: #e0e7ff;
            color: #3730a3;
        }

        .transcript {
            background: #f9fafb;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .transcript-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .transcript-text {
            color: #333;
            line-height: 1.6;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .indicator-list {
            display: grid;
            gap: 12px;
            margin-top: 12px;
        }

        .indicator-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .indicator-name {
            font-size: 14px;
            color: #333;
        }

        .indicator-prob {
            font-weight: 600;
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧠 Audio Biomarker Analysis</h1>
        <p class="subtitle">Record your voice to analyze vocal biomarkers for mental health indicators</p>

        <div class="record-section">
            <button class="record-btn" id="recordBtn">
                <span class="mic-icon">🎤</span>
            </button>
            <div class="status" id="status">Tap to start recording</div>
            <div class="timer" id="timer">00:00</div>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="errorMsg" class="error" style="display: none;"></div>

        <div class="results" id="results">
            <div class="result-card">
                <div class="result-label">⚠️ Severity Level</div>
                <div class="result-value">
                    <span class="pill" id="severityPill"></span>
                    <span style="color: #999; font-size: 14px; margin-left: 8px;" id="severityConf"></span>
                </div>
            </div>

            <div class="result-card">
                <div class="result-label">😊 Detected Emotion</div>
                <div class="result-value">
                    <span class="pill neutral" id="emotionPill"></span>
                </div>
            </div>

            <div class="result-card">
                <div class="result-label">🧪 Anxiety Indicators</div>
                <div class="indicator-list" id="indicatorList"></div>
            </div>

            <div class="transcript">
                <div class="transcript-label">📝 Transcription</div>
                <div class="transcript-text" id="transcriptText"></div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recording = false;
        let startTime;
        let timerInterval;

        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const timer = document.getElementById('timer');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const results = document.getElementById('results');
        const errorMsg = document.getElementById('errorMsg');

        recordBtn.addEventListener('click', toggleRecording);

        async function toggleRecording() {
            if (!recording) {
                await startRecording();
            } else {
                await stopRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await analyzeAudio(audioBlob);
                };

                mediaRecorder.start();
                recording = true;
                recordBtn.classList.add('recording');
                status.textContent = 'Recording... Click to stop';

                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 100);

            } catch (error) {
                showError('Microphone access denied. Please allow microphone permission.');
            }
        }

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timer.textContent = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        async function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                recording = false;
                recordBtn.classList.remove('recording');
                clearInterval(timerInterval);
                status.textContent = 'Processing...';
            }
        }

        async function analyzeAudio(audioBlob) {
            results.style.display = 'none';
            errorMsg.style.display = 'none';
            progress.style.display = 'block';
            setProgress(20, 'Uploading audio...');

            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');

            try {
                setProgress(40, 'Transcribing...');

                const response = await fetch('/upload-audio', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    setProgress(100, 'Complete!');
                    setTimeout(() => displayResults(data), 500);
                } else {
                    showError(data.error || 'Analysis failed');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }

        function setProgress(percent, message) {
            progressBar.style.width = percent + '%';
            status.textContent = message;
        }

        function displayResults(data) {
            progress.style.display = 'none';
            results.style.display = 'block';
            status.textContent = 'Analysis complete!';

            // Severity
            const severity = data.severity_level || 'Normal';
            const severityDisplay = severity === 'Normal' ? 'Low' : severity;
            const severityClass = severity.toLowerCase();
            document.getElementById('severityPill').textContent = severityDisplay;
            document.getElementById('severityPill').className = 'pill ' + severityClass;
            document.getElementById('severityConf').textContent = `${data.severity_confidence}% confidence`;

            // Emotion
            document.getElementById('emotionPill').textContent = data.emotion || 'Neutral';

            // Indicators
            const indicatorList = document.getElementById('indicatorList');
            indicatorList.innerHTML = '';

            if (data.indicators && data.indicators.length > 0) {
                data.indicators.slice(0, 5).forEach(ind => {
                    const div = document.createElement('div');
                    div.className = 'indicator-item';
                    div.innerHTML = `
                        <span class="indicator-name">${ind.name}</span>
                        <span class="indicator-prob">${ind.probability}%</span>
                    `;
                    indicatorList.appendChild(div);
                });
            } else {
                indicatorList.innerHTML = '<div style="color: #666; text-align: center; padding: 12px;">No indicators detected</div>';
            }

            // Transcript
            document.getElementById('transcriptText').textContent = data.transcript || 'No transcription available';
        }

        function showError(message) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = message;
            progress.style.display = 'none';
            status.textContent = 'Ready to record';
            timer.textContent = '00:00';
        }
    </script>
</body>

</html>
